version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: student_wellness_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: wellnesspassword
      POSTGRES_DB: student_wellness
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - wellness-network

  backend:
    build:
      context: ../
      dockerfile: docker/Dockerfile.backend
    container_name: student_wellness_backend
    restart: always
    environment:
      - DATABASE_URL=postgresql://postgres:wellnesspassword@db:5432/student_wellness
      - JWT_SECRET=8f4679720df545b79e2a6d7bb957b42f2b963cfb2a6ad3b0f5ef5b84c8a2cd76
      - JWT_ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=1440
    ports:
      - "8000:8000"
    depends_on:
      - db
    networks:
      - wellness-network

  frontend:
    build:
      context: ../
      dockerfile: docker/Dockerfile.frontend
    container_name: student_wellness_frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - wellness-network

volumes:
  pgdata:

networks:
  wellness-network:
    driver: bridge
